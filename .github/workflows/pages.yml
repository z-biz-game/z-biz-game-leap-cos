name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler and no dependencies: the game ships plain ES modules, so the site is a file
      # copy. Only these paths are reachable from index.html — keep the server, the electron
      # shell, the bake tool, the tests and the CI config out of the artifact. js/data/lots.js is
      # the 40 measured rows the panel prints par/route-count/state-count from; it is a source
      # file like any other, and the distance table every hop is checked against is built by
      # js/core/solve.js in the browser at lot load. assets/ is the exception: those PNGs are
      # generated by assets/gen/leap_art.py (committed, reproducible) and the water, pads, banks,
      # icons and social card are read from disk at runtime, so shipping index.html without them
      # would leave a manifest and an OG card pointing at nothing.
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets css js _site/
          for f in manifest.webmanifest sw.js assets/icons/icon-192.png assets/icons/icon-512.png \
                   assets/icons/apple-touch-icon.png assets/icons/favicon-32.png \
                   assets/og/leap-og-1200x630.png assets/game/water.png; do
            test -s "_site/$f" || { echo "MISSING $f"; exit 1; }
          done
          echo "shipped $(find _site -type f | wc -l) files, $(find _site -name '*.png' | wc -l) PNGs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
